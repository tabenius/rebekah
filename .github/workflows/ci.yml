name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # EPHOR_READ_TOKEN is a PAT (or fine-grained token) with read access
          # to the private tabenius/BAZ.AI-governance repo, which the default
          # GITHUB_TOKEN cannot reach. Nix uses it as access-tokens for
          # github.com, so it also authenticates nixpkgs/WeftMark/Sylvae fetches.
          # Falls back to GITHUB_TOKEN when the secret is unset (public inputs
          # only; the ephor-src fetch will then 404).
          github_access_token: ${{ secrets.EPHOR_READ_TOKEN || secrets.GITHUB_TOKEN }}
      # Bootstrap only for the coordinated runtime-identity PR. The resulting
      # lock is uploaded so it can be reviewed and committed; this conditional
      # step is removed once that generated lock lands on the branch.
      - name: Refresh coordinated integration lock
        if: github.head_ref == 'claude/pensive-pasteur-6cah6b'
        run: nix flake lock --update-input weftmark-src --update-input sylvae-src --update-input ephor-src
      - name: Upload coordinated integration lock
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'claude/pensive-pasteur-6cah6b'
        uses: actions/upload-artifact@v4
        with:
          name: coordinated-integration-flake-lock
          path: flake.lock
          if-no-files-found: error
      - name: Commit coordinated integration lock
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'claude/pensive-pasteur-6cah6b'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock coordinated integration revisions'
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Check flake
        run: nix flake check --print-build-logs
      - name: Test Ephor connector
        run: bash tests/ephor-connector.sh
      - name: Test gateway auth (token + OIDC)
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          bash tests/gateway.sh
      - name: Build image
        run: nix build .#image --print-build-logs
      - name: Load image
        run: docker load < result
      - name: Smoke test
        run: bash tests/smoke.sh
