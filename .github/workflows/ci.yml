name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # EPHOR_READ_TOKEN is a PAT (or fine-grained token) with read access
          # to the private tabenius/BAZ.AI-governance repo, which the default
          # GITHUB_TOKEN cannot reach. Nix uses it as access-tokens for
          # github.com, so it also authenticates nixpkgs/WeftMark/Sylvae fetches.
          # Falls back to GITHUB_TOKEN when the secret is unset (public inputs
          # only; the ephor-src fetch will then 404).
          github_access_token: ${{ secrets.EPHOR_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Check flake
        run: nix flake check --print-build-logs
      - name: Test Ephor connector
        run: bash tests/ephor-connector.sh
      - name: Test OpenCode evidence bridge
        run: bash tests/opencode-evidence.sh
      - name: Test gateway auth (token + OIDC)
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          bash tests/gateway.sh
      - name: Test the Dash push client
        run: python3 tests/dash-push.py
      - name: Build image
        run: nix build .#image --print-build-logs
      - name: Load image
        run: docker load < result
      - name: Smoke test
        run: bash tests/smoke.sh
