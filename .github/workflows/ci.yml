name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # The baseline image and checks use public inputs only: Ephor is
          # opt-in and built in the ephor job below.
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check flake
        run: nix flake check --print-build-logs
      - name: Test Ephor connector
        run: bash tests/ephor-connector.sh
      - name: Test OpenCode evidence bridge
        run: bash tests/opencode-evidence.sh
      - name: Test gateway auth (token + OIDC)
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          bash tests/gateway.sh
      - name: Test the Dash push client
        run: python3 tests/dash-push.py
      - name: Build image
        run: nix build .#image --print-build-logs
      - name: Load image
        run: docker load < result
      - name: Smoke test
        run: bash tests/smoke.sh

  # The opt-in Ephor image. ephor-src is the private tabenius/BAZ.AI-governance
  # repository: EPHOR_READ_TOKEN is a PAT (or fine-grained token) with read
  # access to it. Without the secret (a fork, a public mirror) the job skips
  # itself; the baseline above never needs it.
  ephor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_EPHOR_TOKEN: ${{ secrets.EPHOR_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_EPHOR_TOKEN == 'true'
      - uses: cachix/install-nix-action@v31
        if: env.HAS_EPHOR_TOKEN == 'true'
        with:
          github_access_token: ${{ secrets.EPHOR_READ_TOKEN }}
      # ephor-src defaults to an in-repo placeholder; nix/ephor.rev pins the
      # revision the opt-in image is built from.
      - name: Build and test the Ephor bridge
        if: env.HAS_EPHOR_TOKEN == 'true'
        run: nix build .#ephor --print-build-logs --override-input ephor-src "github:tabenius/BAZ.AI-governance/$(cat nix/ephor.rev)"
      - name: Build the Ephor image
        if: env.HAS_EPHOR_TOKEN == 'true'
        run: nix build .#image-ephor --print-build-logs --override-input ephor-src "github:tabenius/BAZ.AI-governance/$(cat nix/ephor.rev)"
      - name: Load image
        if: env.HAS_EPHOR_TOKEN == 'true'
        run: docker load < result
      - name: Smoke test with Ephor enabled
        if: env.HAS_EPHOR_TOKEN == 'true'
        run: REBEKAH_SMOKE_EPHOR=1 bash tests/smoke.sh
      - name: No Ephor token
        if: env.HAS_EPHOR_TOKEN != 'true'
        run: echo "EPHOR_READ_TOKEN is not set; skipping the opt-in Ephor image."
